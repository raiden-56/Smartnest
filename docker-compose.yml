# Local development services for SmartNest.
#   docker compose up -d db               → PostgreSQL only (typical development)
#   docker compose --profile mqtt up -d   → also a Mosquitto broker for Home Assistant's MQTT integration
#   docker compose --profile app up -d    → the production image (API + built web app) on http://localhost:8080
#
# The mock Home Assistant used by tests runs with `npm run mock-ha` (no container needed).
services:
  db:
    image: postgres:16-alpine
    container_name: smartnest-db
    environment:
      POSTGRES_USER: smartnest
      POSTGRES_PASSWORD: smartnest
      POSTGRES_DB: smartnest
    ports:
      - "5442:5432"
    volumes:
      - smartnest-db:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartnest"]
      interval: 5s
      timeout: 3s
      retries: 10

  mosquitto:
    profiles: ["mqtt"]
    image: eclipse-mosquitto:2
    ports:
      - "1883:1883"
    volumes:
      # Create the password file first:
      #   docker compose run --rm mosquitto mosquitto_passwd -c -b /mosquitto/config/passwords smartnest <password>
      - ./docker/mosquitto:/mosquitto/config

  app:
    profiles: ["app"]
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://smartnest:smartnest@db:5432/smartnest?schema=public
      PORT: "8080"
      WEB_ORIGIN: http://localhost:8080
      PUBLIC_APP_URL: http://localhost:8080
      # Required in production — set real values in a .env file next to this compose file
      CREDENTIAL_ENCRYPTION_KEY: ${CREDENTIAL_ENCRYPTION_KEY:?set CREDENTIAL_ENCRYPTION_KEY}
      STREAM_TOKEN_SECRET: ${STREAM_TOKEN_SECRET:?set STREAM_TOKEN_SECRET}
    ports:
      - "8080:8080"

volumes:
  smartnest-db:
