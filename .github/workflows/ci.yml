# Checks every pull request; also called by release.yml before anything is published or deployed.
name: CI

on:
  pull_request:
  workflow_call:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CI: true
  # Matches the defaults in apps/server/test and playwright.config.ts (Postgres service published on 5442).
  TEST_DATABASE_URL: postgresql://smartnest:smartnest@localhost:5442/smartnest_test?schema=public

jobs:
  verify:
    name: Secrets, typecheck, unit + integration tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: smartnest
          POSTGRES_PASSWORD: smartnest
          POSTGRES_DB: smartnest_test
        ports:
          - 5442:5432
        options: >-
          --health-cmd "pg_isready -U smartnest -d smartnest_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run lint:secrets
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  e2e:
    name: End-to-end (Playwright + mock Home Assistant)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: smartnest
          POSTGRES_PASSWORD: smartnest
          POSTGRES_DB: smartnest_test
        ports:
          - 5442:5432
        options: >-
          --health-cmd "pg_isready -U smartnest -d smartnest_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build:shared
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  docker:
    name: Docker image builds
    # release.yml builds and pushes the image itself; this only proves the Dockerfile on pull requests.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
